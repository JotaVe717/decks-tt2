name: Sincronizar Clã GameHive

on:
  schedule:
    # Executa a cada 12 horas para cumprir o limite imposto pela GameHive
    - cron: '0 */1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descarregar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Executar robo da GameHive
        env:
          GH_APP_TOKEN: ${{ secrets.GH_APP_TOKEN }}
        run: python atualizar.py

      - name: Guardar cla.json no repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cla.json
          git commit -m "Auto: Dados do cla sincronizados via GameHive" || echo "Sem alteracoes"
          git push