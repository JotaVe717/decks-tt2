name: Sincronizar Clã GameHive

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-dados:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests

      - name: Executar script da GameHive
        env:
          GH_APP_TOKEN: ${{ secrets.GH_APP_TOKEN || 'cd880d55-80c3-44cf-9857-e4ab5ccdaa0a' }}
        run: python atualizar.py

      - name: Salvar cla.json no repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cla.json
          git commit -m "Auto: Dados do clã atualizados via GameHive API" || echo "Sem mudanças"
          git push