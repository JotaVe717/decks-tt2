<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Importar Perfil & Cartas - Tap Titans 2</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }
    body {
      background-color: #0f141c;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 10px;
      min-height: 100vh;
    }
    .back-btn {
      align-self: flex-start;
      max-width: 900px;
      margin: 0 auto 14px auto;
      width: 100%;
      text-decoration: none;
      color: #8fa0b5;
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }
    .back-btn:hover {
      color: #f5a623;
    }
    .container {
      width: 100%;
      max-width: 900px;
      background: #18202a;
      border: 1px solid #283545;
      border-radius: 16px;
      padding: 18px 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .title {
      text-align: center;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .title span {
      color: #f5a623;
    }
    .subtitle {
      text-align: center;
      font-size: 12px;
      color: #8fa0b5;
      margin-bottom: 18px;
    }

    /* ENTRADA DE DADOS */
    .import-card {
      background: #212c3a;
      border: 1px dashed #3a4b60;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .import-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .btn-paste {
      background: #f5a623;
      border: none;
      color: #0f141c;
      font-weight: 800;
      padding: 9px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s;
    }
    .btn-paste:hover {
      opacity: 0.9;
    }
    .btn-secondary {
      background: #18202a;
      border: 1px solid #324357;
      color: #d1dbe5;
      font-weight: 600;
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: border-color 0.2s;
    }
    .btn-secondary:hover {
      border-color: #f5a623;
      color: #fff;
    }
    textarea {
      width: 100%;
      height: 60px;
      background: #141c24;
      border: 1px solid #2d3c4e;
      border-radius: 8px;
      padding: 8px;
      color: #a0aec0;
      font-family: monospace;
      font-size: 11px;
      resize: vertical;
    }
    textarea:focus {
      outline: none;
      border-color: #f5a623;
    }

    /* SUMÁRIO COMPLETO COM WILDCARDS E NECROBEAR */
    .player-summary {
      background: #121922;
      border: 1px solid #283545;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 22px;
      display: none;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      text-align: center;
    }
    .summary-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .summary-item span {
      font-size: 10px;
      color: #8fa0b5;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .summary-item strong {
      font-size: 15px;
      color: #50e3c2;
    }

    /* SEÇÕES DE CATEGORIA COM ESPAÇAMENTO */
    .section-category {
      margin-bottom: 24px;
      display: none;
    }
    .category-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 4px;
      border-bottom: 1px solid #283545;
    }
    .category-title {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .title-burst { color: #ff5722; }
    .title-affliction { color: #38a1f3; }
    .title-support { color: #4cd964; }

    /* FORÇADO ESTRITAMENTE 6 COLUNAS NO DESKTOP E NO MOBILE */
    .cards-grid-6 {
      display: grid;
      grid-template-columns: repeat(6, 1fr) !important;
      gap: 6px;
      width: 100%;
    }

    /* CONTAINER DA CARTA COM POSIÇÃO RELATIVA */
    .card-tile {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      overflow: hidden;
      background: #0f141c;
      border: 1.5px solid #2b394a;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .card-tile:hover {
      transform: translateY(-2px);
      border-color: #f5a623;
    }
    .card-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* NÍVEL SOBRESCRITO NO CANTO INFERIOR DIREITO */
    .card-overlay-lvl {
      position: absolute;
      bottom: 2px;
      right: 2px;
      background: rgba(15, 20, 28, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(2px);
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      padding: 1px 4px;
      border-radius: 4px;
      line-height: 1;
      text-shadow: 0 1px 2px #000;
      pointer-events: none;
    }

    /* CORES DE BORDA POR TIPO */
    .border-burst { border-color: rgba(255, 87, 34, 0.5); }
    .border-affliction { border-color: rgba(56, 161, 243, 0.5); }
    .border-support { border-color: rgba(76, 217, 100, 0.5); }

    .empty-state {
      text-align: center;
      color: #8fa0b5;
      font-size: 13px;
      padding: 30px 10px;
    }

    /* AJUSTE FINO PARA TELAS PEQUENAS (GARANTE 6 POR LINHA SEM ESTICAR) */
    @media (max-width: 480px) {
      .container {
        padding: 14px 6px;
      }
      .cards-grid-6 {
        gap: 4px;
      }
      .card-tile {
        border-radius: 6px;
      }
      .card-overlay-lvl {
        font-size: 9.5px;
        padding: 1px 3px;
        bottom: 1px;
        right: 1px;
      }
      .player-summary {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
    }
  </style>
</head>
<body>

  <a href="index.html" class="back-btn">&larr; Voltar ao Menu</a>

  <div class="container">
    <div class="title">Importar <span>Cartas & Níveis</span></div>
    <div class="subtitle">Cole o JSON para ver o nível sobrescrito em cada carta por categoria</div>

    <!-- ENTRADA -->
    <div class="import-card">
      <div class="import-actions">
        <button class="btn-paste" onclick="colarDoClipboard()">📋 Paste (Colar)</button>
        <button class="btn-secondary" onclick="processarTextoManual()">Processar Texto</button>
      </div>
      <textarea id="jsonInput" placeholder='Cole seu JSON exportado aqui'></textarea>
    </div>

    <!-- SUMÁRIO DO JOGADOR -->
    <div class="player-summary" id="playerSummary">
      <div class="summary-item">
        <span>Max Stage</span>
        <strong id="sumStage">-</strong>
      </div>
      <div class="summary-item">
        <span>Raid Level</span>
        <strong id="sumRaidLvl">-</strong>
      </div>
      <div class="summary-item">
        <span>Soma dos Níveis</span>
        <strong id="sumLvlSum">-</strong>
      </div>
      <div class="summary-item">
        <span>Wildcards</span>
        <strong id="sumWildcards" style="color: #f5a623;">-</strong>
      </div>
      <div class="summary-item">
        <span>Necrobear</span>
        <strong id="sumNecrobear" style="color: #a29bfe;">-</strong>
      </div>
    </div>

    <div id="emptyMessage" class="empty-state">
      Nenhum perfil carregado. Clique em <strong>Paste</strong> ou cole o JSON acima para visualizar as cartas.
    </div>

    <!-- 1. EXPLOSÃO (BURST) -->
    <div class="section-category" id="secBurst">
      <div class="category-header">
        <span class="category-title title-burst">Explosão</span>
      </div>
      <div class="cards-grid-6" id="gridBurst"></div>
    </div>

    <!-- 2. AFLIÇÃO (AFFLICTION) -->
    <div class="section-category" id="secAffliction">
      <div class="category-header">
        <span class="category-title title-affliction">Aflição</span>
      </div>
      <div class="cards-grid-6" id="gridAffliction"></div>
    </div>

    <!-- 3. SUPORTE (SUPPORT) -->
    <div class="section-category" id="secSupport">
      <div class="category-header">
        <span class="category-title title-support">Suporte</span>
      </div>
      <div class="cards-grid-6" id="gridSupport"></div>
    </div>

  </div>

  <script>
    const CARD_METADATA = {
      // EXPLOSÃO (BURST)
      "MoonBeam": { type: "Burst", img: "Cards/mb.png" },
      "Fragmentize": { type: "Burst", img: "Cards/fr.png" },
      "SkullBash": { type: "Burst", img: "Cards/sb.png" },
      "RazorWind": { type: "Burst", img: "Cards/rw.png" },
      "WhipOfLightning": { type: "Burst", img: "Cards/wol.png" },
      "BurstCount": { type: "Burst", img: "Cards/csb.png" },
      "Purify": { type: "Burst", img: "Cards/pb.png" },
      "LimbBurst": { type: "Burst", img: "Cards/ps.png" },
      "FlakShot": { type: "Burst", img: "Cards/fs.png" },
      "Haymaker": { type: "Burst", img: "Cards/ch.png" },
      "ChainLightning": { type: "Burst", img: "Cards/cov.png" },
      "MirrorForce": { type: "Burst", img: "Cards/mf.png" },
      "CelestialStatic": { type: "Burst", img: "Cards/cs.png" },

      // AFLIÇÃO (AFFLICTION)
      "BurningAttack": { type: "Affliction", img: "Cards/bi.png" },
      "PoisonAttack": { type: "Affliction", img: "Cards/ad.png" },
      "DecayingAttack": { type: "Affliction", img: "Cards/ds.png" },
      "Fuse": { type: "Affliction", img: "Cards/fb.png" },
      "Shadow": { type: "Affliction", img: "Cards/gs.png" },
      "PlagueAttack": { type: "Affliction", img: "Cards/tp.png" },
      "Disease": { type: "Affliction", img: "Cards/ra.png" },
      "Swarm": { type: "Affliction", img: "Cards/rs.png" },
      "RuinousRust": { type: "Affliction", img: "Cards/rr.png" },
      "PowerBubble": { type: "Affliction", img: "Cards/bb.png" },
      "RuneAttack": { type: "Affliction", img: "Cards/ma.png" },

      // SUPORTE (SUPPORT)
      "Weaken": { type: "Burst", img: "Cards/gb.png" },
      "BarbedMorningstar": { type: "Burst", img: "Cards/bm.jpg" },
      "MagicPotion": { type: "Affliction", img: "Cards/am.jpg" },
      "SandsOfTime": { type: "Affliction", img: "Cards/sot.png" },
      "CosmicBarb": { type: "Affliction", img: "Cards/zz.jpg" },
      "ExecutionersAxe": { type: "Support", img: "Cards/ci.png" },
      "CrushingVoid": { type: "Support", img: "Cards/iv.png" },
      "MentalFocus": { type: "Support", img: "Cards/rg.png" },
      "ImpactAttack": { type: "Support", img: "Cards/if.png" },
      "InnerTruth": { type: "Support", img: "Cards/sf.png" },
      "FinisherAttack": { type: "Support", img: "Cards/vm.png" },
      "SuperheatMetal": { type: "Support", img: "Cards/pr.png" },
      "BurstBoost": { type: "Support", img: "Cards/af.png" },
      "LimbSupport": { type: "Support", img: "Cards/gv.png" },
      "TotemFairySkill": { type: "Support", img: "Cards/tot.png" },
      "TeamTactics": { type: "Support", img: "Cards/tt.png" },
      "SpinalTap": { type: "Support", img: "Cards/ss.png" },
      "AstralEcho": { type: "Support", img: "Cards/ae.png" },
      "TriangleSupport": { type: "Support", img: "Cards/rk.png" },
      "BattleDrums": { type: "Support", img: "Cards/bd.jpg" }
    };

    async function colarDoClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        document.getElementById("jsonInput").value = text;
        processarJSON(text);
      } catch (err) {
        alert("Permissão negada. Cole o JSON manualmente no campo abaixo e clique em 'Processar Texto'.");
      }
    }

    function processarTextoManual() {
      const text = document.getElementById("jsonInput").value.trim();
      if (!text) {
        alert("A caixa de texto está vazia.");
        return;
      }
      processarJSON(text);
    }

    function processarJSON(rawText) {
      try {
        const data = JSON.parse(rawText);

        if (!data.raidCards) {
          alert("JSON inválido ou sem a seção 'raidCards'.");
          return;
        }

        // Atualização do Sumário (com Wildcards e Necrobear)
        document.getElementById("playerSummary").style.display = "grid";
        document.getElementById("sumStage").textContent = data.playerStats?.["Max Prestige Stage"] || "-";
        document.getElementById("sumRaidLvl").textContent = data.raidStats?.["Raid Level"] || "-";
        document.getElementById("sumLvlSum").textContent = data.raidStats?.["Total Raid Card Levels"] || "-";
        document.getElementById("sumWildcards").textContent = data.raidStats?.["Wildcards"] || "0";
        document.getElementById("sumNecrobear").textContent = data.playerStats?.["Necrobear Level"] ? `Nv. ${data.playerStats["Necrobear Level"]}` : "-";

        document.getElementById("emptyMessage").style.display = "none";

        const burstList = [];
        const afflictionList = [];
        const supportList = [];

        for (const [key, val] of Object.entries(data.raidCards)) {
          const meta = CARD_METADATA[key] || { type: "Support", img: "Cards/wc.png" };
          const cardObj = {
            id: key,
            type: meta.type,
            img: meta.img,
            level: val.lv || 0
          };

          if (meta.type === "Burst") burstList.push(cardObj);
          else if (meta.type === "Affliction") afflictionList.push(cardObj);
          else supportList.push(cardObj);
        }

        // Ordena cada grupo do maior nível para o menor
        burstList.sort((a, b) => b.level - a.level);
        afflictionList.sort((a, b) => b.level - a.level);
        supportList.sort((a, b) => b.level - a.level);

        renderGrid("gridBurst", "secBurst", burstList, "border-burst");
        renderGrid("gridAffliction", "secAffliction", afflictionList, "border-affliction");
        renderGrid("gridSupport", "secSupport", supportList, "border-support");

      } catch (err) {
        console.error(err);
        alert("Erro ao ler o JSON. Verifique se copiou o texto completo.");
      }
    }

    function renderGrid(containerId, sectionId, list, borderClass) {
      const container = document.getElementById(containerId);
      const section = document.getElementById(sectionId);
      container.innerHTML = "";

      if (list.length === 0) {
        section.style.display = "none";
        return;
      }

      section.style.display = "block";

      list.forEach(card => {
        const div = document.createElement("div");
        div.className = `card-tile ${borderClass}`;
        div.innerHTML = `
          <img src="${card.img}" class="card-thumb" alt="" onerror="this.src='Cards/wc.png'">
          <span class="card-overlay-lvl">${card.level}</span>
        `;
        container.appendChild(div);
      });
    }
  </script>
</body>
</html>
