<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Importar Perfil & Cartas - Tap Titans 2</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0f141c;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 8px 70px 8px;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .back-btn {
      align-self: flex-start;
      max-width: 900px;
      margin: 0 auto 12px auto;
      width: 100%;
      text-decoration: none;
      color: #8fa0b5;
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }
    .back-btn:hover {
      color: #f5a623;
    }
    .container {
      width: 100%;
      max-width: 900px;
      background: #18202a;
      border: 1px solid #283545;
      border-radius: 16px;
      padding: 16px 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .title {
      text-align: center;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .title span {
      color: #f5a623;
    }
    .subtitle {
      text-align: center;
      font-size: 12px;
      color: #8fa0b5;
      margin-bottom: 16px;
    }

    /* ENTRADA DE DADOS */
    .import-card {
      background: #212c3a;
      border: 1px dashed #3a4b60;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .import-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .btn-paste {
      background: #f5a623;
      border: none;
      color: #0f141c;
      font-weight: 800;
      padding: 9px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s;
    }
    .btn-paste:hover {
      opacity: 0.9;
    }
    .btn-secondary {
      background: #18202a;
      border: 1px solid #324357;
      color: #d1dbe5;
      font-weight: 600;
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: border-color 0.2s;
    }
    .btn-secondary:hover {
      border-color: #f5a623;
      color: #fff;
    }
    textarea {
      width: 100%;
      height: 55px;
      background: #141c24;
      border: 1px solid #2d3c4e;
      border-radius: 8px;
      padding: 8px;
      color: #a0aec0;
      font-family: monospace;
      font-size: 11px;
      resize: vertical;
    }
    textarea:focus {
      outline: none;
      border-color: #f5a623;
    }

    /* SUMÁRIO DO JOGADOR */
    .player-summary {
      background: #121922;
      border: 1px solid #283545;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 20px;
      display: none;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 8px;
      text-align: center;
    }
    .summary-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .summary-item span {
      font-size: 9.5px;
      color: #8fa0b5;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .summary-item strong {
      font-size: 14px;
      color: #50e3c2;
    }

    /* CATEGORIAS */
    .section-category {
      margin-bottom: 22px;
      display: none;
    }
    .category-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid #283545;
    }
    .category-title {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .title-burst { color: #ff5722; }
    .title-affliction { color: #38a1f3; }
    .title-support { color: #4cd964; }

    /* ESTRITAMENTE 6 COLUNAS */
    .cards-grid-6 {
      display: grid;
      grid-template-columns: repeat(6, 1fr) !important;
      gap: 5px;
      width: 100%;
    }

    /* CONTAINER DA CARTA */
    .card-tile {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 6px;
      background: #0f141c;
      border: 1.5px solid #2b394a;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .card-tile:hover,
    .card-tile.active-selected {
      transform: translateY(-2px);
      border-color: #f5a623 !important;
      z-index: 20;
    }
    .card-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 5px;
    }

    /* NÍVEL SOBRESCRITO */
    .card-overlay-lvl {
      position: absolute;
      bottom: 2px;
      right: 2px;
      background: rgba(15, 20, 28, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      font-size: 10.5px;
      font-weight: 800;
      padding: 1px 3px;
      border-radius: 4px;
      line-height: 1;
      text-shadow: 0 1px 2px #000;
      pointer-events: none;
    }

    /* BORDAS POR TIPO */
    .border-burst { border-color: rgba(255, 87, 34, 0.45); }
    .border-affliction { border-color: rgba(56, 161, 243, 0.45); }
    .border-support { border-color: rgba(76, 217, 100, 0.45); }

    .empty-state {
      text-align: center;
      color: #8fa0b5;
      font-size: 13px;
      padding: 30px 10px;
    }

    /* ---------------- TOOLTIP DESKTOP (FLUTUANTE NAS CARTAS) ---------------- */
    @media (min-width: 601px) {
      .card-tooltip {
        visibility: hidden;
        opacity: 0;
        width: 190px;
        background-color: #121922;
        color: #fff;
        text-align: left;
        border-radius: 8px;
        padding: 8px 10px;
        position: absolute;
        z-index: 100;
        bottom: 112%;
        left: 50%;
        transform: translateX(-50%);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.9);
        border: 1px solid #3a4b60;
        transition: opacity 0.2s ease, transform 0.2s ease;
        pointer-events: none;
      }
      .card-tooltip::after {
        content: "";
        position: absolute;
        top: 100%;
        left: 50%;
        margin-left: -5px;
        border-width: 5px;
        border-style: solid;
        border-color: #3a4b60 transparent transparent transparent;
      }
      .card-tile:hover .card-tooltip {
        visibility: visible;
        opacity: 1;
        transform: translateX(-50%) translateY(-4px);
      }
      /* Coluna 1: abre para a direita */
      .cards-grid-6 .card-tile:nth-child(6n+1) .card-tooltip {
        left: 0;
        transform: translateX(0);
      }
      .cards-grid-6 .card-tile:nth-child(6n+1) .card-tooltip::after {
        left: 20px;
        margin-left: 0;
      }
      .cards-grid-6 .card-tile:nth-child(6n+1):hover .card-tooltip {
        transform: translateX(0) translateY(-4px);
      }
      /* Coluna 6: abre para a esquerda */
      .cards-grid-6 .card-tile:nth-child(6n) .card-tooltip {
        left: 100%;
        transform: translateX(-100%);
      }
      .cards-grid-6 .card-tile:nth-child(6n) .card-tooltip::after {
        left: auto;
        right: 20px;
        margin-left: 0;
      }
      .cards-grid-6 .card-tile:nth-child(6n):hover .card-tooltip {
        transform: translateX(-100%) translateY(-4px);
      }

      /* Painel mobile ocultado no desktop */
      #mobileCardDrawer {
        display: none !important;
      }
    }

    .tooltip-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 4px;
    }
    .tooltip-name {
      font-size: 12px;
      font-weight: 700;
      color: #f5a623;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tooltip-rank {
      font-size: 10px;
      font-weight: 900;
      color: #ff5722;
      background: rgba(255, 69, 0, 0.25);
      border: 1px solid rgba(255, 87, 34, 0.6);
      padding: 1px 5px;
      border-radius: 4px;
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }
    .tooltip-target {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      color: #50e3c2;
      background: rgba(80, 227, 194, 0.12);
      border: 1px solid rgba(80, 227, 194, 0.35);
      padding: 1px 5px;
      border-radius: 4px;
      margin-bottom: 4px;
      letter-spacing: 0.2px;
    }
    .tooltip-desc {
      font-size: 10.5px;
      color: #c0ccdc;
      line-height: 1.35;
      display: block;
    }

    /* ---------------- MODAL / DRAWER FIXO EXCLUSIVO MOBILE ---------------- */
    @media (max-width: 600px) {
      /* Oculta os tooltips internos para não quebrar a tela */
      .card-tooltip {
        display: none !important;
      }
      .card-overlay-lvl {
        font-size: 9px;
        padding: 1px 2px;
        bottom: 1px;
        right: 1px;
      }
      /* Banner Fixo no Rodapé do Mobile */
      #mobileCardDrawer {
        position: fixed;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%) translateY(120%);
        width: calc(100vw - 20px);
        max-width: 420px;
        background: #141d27;
        border: 1.5px solid #f5a623;
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.95);
        border-radius: 12px;
        padding: 12px 14px;
        z-index: 10000;
        transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s ease;
        opacity: 0;
        pointer-events: none;
      }
      #mobileCardDrawer.active {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
        pointer-events: auto;
      }
      .drawer-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 4px;
      }
      .drawer-title-group {
        display: flex;
        align-items: center;
        gap: 8px;
        overflow: hidden;
      }
      .drawer-name {
        font-size: 13.5px;
        font-weight: 800;
        color: #f5a623;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .drawer-rank {
        font-size: 10.5px;
        font-weight: 900;
        color: #ff5722;
        background: rgba(255, 69, 0, 0.25);
        border: 1px solid rgba(255, 87, 34, 0.6);
        padding: 1px 5px;
        border-radius: 4px;
        flex-shrink: 0;
      }
      .drawer-close {
        background: none;
        border: none;
        color: #8fa0b5;
        font-size: 18px;
        font-weight: 700;
        line-height: 1;
        padding: 2px 6px;
        cursor: pointer;
      }
      .drawer-target {
        display: inline-block;
        font-size: 10.5px;
        font-weight: 700;
        color: #50e3c2;
        background: rgba(80, 227, 194, 0.12);
        border: 1px solid rgba(80, 227, 194, 0.35);
        padding: 1px 6px;
        border-radius: 4px;
        margin-bottom: 6px;
      }
      .drawer-desc {
        font-size: 11px;
        color: #d1dbe5;
        line-height: 1.4;
      }
    }
  </style>
</head>
<body>

  <a href="index.html" class="back-btn">&larr; Voltar ao Menu</a>

  <div class="container">
    <div class="title">Importar <span>Cartas & Níveis</span></div>
    <div class="subtitle">Toque na carta para inspecionar rank, alvo e descrição sem cortes</div>

    <!-- ENTRADA -->
    <div class="import-card">
      <div class="import-actions">
        <button class="btn-paste" onclick="colarDoClipboard()">📋 Paste (Colar)</button>
        <button class="btn-secondary" onclick="processarTextoManual()">Processar Texto</button>
      </div>
      <textarea id="jsonInput" placeholder='Cole seu JSON exportado aqui'></textarea>
    </div>

    <!-- SUMÁRIO DO JOGADOR -->
    <div class="player-summary" id="playerSummary">
      <div class="summary-item">
        <span>Max Stage</span>
        <strong id="sumStage">-</strong>
      </div>
      <div class="summary-item">
        <span>Raid Level</span>
        <strong id="sumRaidLvl">-</strong>
      </div>
      <div class="summary-item">
        <span>Soma dos Níveis</span>
        <strong id="sumLvlSum">-</strong>
      </div>
      <div class="summary-item">
        <span>Wildcards</span>
        <strong id="sumWildcards" style="color: #f5a623;">-</strong>
      </div>
      <div class="summary-item">
        <span>Necrobear</span>
        <strong id="sumNecrobear" style="color: #a29bfe;">-</strong>
      </div>
    </div>

    <div id="emptyMessage" class="empty-state">
      Nenhum perfil carregado. Clique em <strong>Paste</strong> ou cole o JSON acima para visualizar as cartas.
    </div>

    <!-- 1. EXPLOSÃO (BURST) -->
    <div class="section-category" id="secBurst">
      <div class="category-header">
        <span class="category-title title-burst">Explosão</span>
      </div>
      <div class="cards-grid-6" id="gridBurst"></div>
    </div>

    <!-- 2. AFLIÇÃO (AFFLICTION) -->
    <div class="section-category" id="secAffliction">
      <div class="category-header">
        <span class="category-title title-affliction">Aflição</span>
      </div>
      <div class="cards-grid-6" id="gridAffliction"></div>
    </div>

    <!-- 3. SUPORTE (SUPPORT) -->
    <div class="section-category" id="secSupport">
      <div class="category-header">
        <span class="category-title title-support">Suporte</span>
      </div>
      <div class="cards-grid-6" id="gridSupport"></div>
    </div>

  </div>

  <!-- DRAWER FLUTUANTE EXCLUSIVO PARA MOBILE -->
  <div id="mobileCardDrawer">
    <div class="drawer-header">
      <div class="drawer-title-group">
        <span class="drawer-name" id="mDrawerName">-</span>
        <span class="drawer-rank" id="mDrawerRank">S</span>
      </div>
      <button class="drawer-close" onclick="fecharMobileDrawer()">&times;</button>
    </div>
    <span class="drawer-target" id="mDrawerTarget">-</span>
    <div class="drawer-desc" id="mDrawerDesc">-</div>
  </div>

      "LimbSupport": { name: "Grasping Vines", rank: "A", type: "Support", img: "Cards/gv.png", target: "Membros (Braços/Pernas)", desc: "Prende os membros concedendo dano extra a eles." },

    async function colarDoClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        document.getElementById("jsonInput").value = text;
        processarJSON(text);
      } catch (err) {
        alert("Permissão negada. Cole o JSON manualmente no campo abaixo e clique em 'Processar Texto'.");
      }
    }

    function processarTextoManual() {
      const text = document.getElementById("jsonInput").value.trim();
      if (!text) {
        alert("A caixa de texto está vazia.");
        return;
      }
      processarJSON(text);
    }

    function processarJSON(rawText) {
      try {
        const data = JSON.parse(rawText);

        if (!data.raidCards) {
          alert("JSON inválido ou sem a seção 'raidCards'.");
          return;
        }

        document.getElementById("playerSummary").style.display = "grid";
        document.getElementById("sumStage").textContent = data.playerStats?.["Max Prestige Stage"] || "-";
        document.getElementById("sumRaidLvl").textContent = data.raidStats?.["Raid Level"] || "-";
        document.getElementById("sumLvlSum").textContent = data.raidStats?.["Total Raid Card Levels"] || "-";
        document.getElementById("sumWildcards").textContent = data.raidStats?.["Wildcards"] || "0";
        document.getElementById("sumNecrobear").textContent = data.playerStats?.["Necrobear Level"] ? `Nv. ${data.playerStats["Necrobear Level"]}` : "-";

        document.getElementById("emptyMessage").style.display = "none";

        const burstList = [];
        const afflictionList = [];
        const supportList = [];

        for (const [key, val] of Object.entries(data.raidCards)) {
          const meta = CARD_METADATA[key] || { 
            name: key, 
            rank: "B",
            type: "Support", 
            img: "Cards/wc.png", 
            target: "Geral", 
            desc: "Sem descrição disponível." 
          };
          const cardObj = {
            id: key,
            name: meta.name,
            rank: meta.rank || "B",
            target: meta.target,
            desc: meta.desc,
            type: meta.type,
            img: meta.img,
            level: val.lv || 0
          };

          if (meta.type === "Burst") burstList.push(cardObj);
          else if (meta.type === "Affliction") afflictionList.push(cardObj);
          else supportList.push(cardObj);
        }

        burstList.sort((a, b) => b.level - a.level);
        afflictionList.sort((a, b) => b.level - a.level);
        supportList.sort((a, b) => b.level - a.level);

        renderGrid("gridBurst", "secBurst", burstList, "border-burst");
        renderGrid("gridAffliction", "secAffliction", afflictionList, "border-affliction");
        renderGrid("gridSupport", "secSupport", supportList, "border-support");

      } catch (err) {
        console.error(err);
        alert("Erro ao ler o JSON. Verifique se copiou o texto completo.");
      }
    }

    function abrirMobileDrawer(card, elemento) {
      document.querySelectorAll('.card-tile').forEach(t => t.classList.remove('active-selected'));
      elemento.classList.add('active-selected');

      document.getElementById('mDrawerName').textContent = card.name;
      document.getElementById('mDrawerRank').textContent = card.rank;
      document.getElementById('mDrawerTarget').textContent = card.target;
      document.getElementById('mDrawerDesc').textContent = card.desc;

      const drawer = document.getElementById('mobileCardDrawer');
      drawer.classList.add('active');
    }

    function fecharMobileDrawer() {
      document.querySelectorAll('.card-tile').forEach(t => t.classList.remove('active-selected'));
      document.getElementById('mobileCardDrawer').classList.remove('active');
    }

    function renderGrid(containerId, sectionId, list, borderClass) {
      const container = document.getElementById(containerId);
      const section = document.getElementById(sectionId);
      container.innerHTML = "";

      if (list.length === 0) {
        section.style.display = "none";
        return;
      }

      section.style.display = "block";

      list.forEach(card => {
        const div = document.createElement("div");
        div.className = `card-tile ${borderClass}`;

        div.onclick = (e) => {
          if (window.innerWidth <= 600) {
            abrirMobileDrawer(card, div);
            e.stopPropagation();
          }
        };

        div.innerHTML = `
          <img src="${card.img}" class="card-thumb" alt="${card.name}" onerror="this.src='Cards/wc.png'">
          <span class="card-overlay-lvl">${card.level}</span>
          <div class="card-tooltip">
            <div class="tooltip-header">
              <span class="tooltip-name">${card.name}</span>
              <span class="tooltip-rank">${card.rank}</span>
            </div>
            <span class="tooltip-target">${card.target}</span>
            <span class="tooltip-desc">${card.desc}</span>
          </div>
        `;
        container.appendChild(div);
      });
    }

    // Fecha o drawer mobile ao tocar fora
    document.addEventListener('click', (e) => {
      const drawer = document.getElementById('mobileCardDrawer');
      if (drawer && !drawer.contains(e.target) && !e.target.closest('.card-tile')) {
        fecharMobileDrawer();
      }
    });
  </script>
